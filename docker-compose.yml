services:
  nginx:
    image: nginx:1.31.8-alpine3.24
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        GROUP_GID: ${GROUP_GID:-1000}
    working_dir: /var/www
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      PHP_IDE_CONFIG: "serverName=localhost"
    volumes:
      - ./:/var/www
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:18
#    ports:
#      - "5432:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine3.23
    volumes:
      - redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      retries: 3
      timeout: 5s
    restart: unless-stopped

  blender:
    build:
      context: .
      dockerfile: docker/blender/Dockerfile
    # platform: "linux/amd64"
    working_dir: /tmp
    volumes:
      - ./blender:/tmp/blender
      - ./storage/app:/tmp/storage/app
    environment:
      REDIS_URL: "redis://redis:6379/0"
      BLENDER_QUEUE: "laravel-database-model:blender"
      SAVER_QUEUE: "laravel-database-model:saver"
      STATUS_PREFIX: "laravel-database-model:status:"
      MODEL_OBJ_DIR_PREFIX: "/tmp/storage/app/private/model/"
      MODEL_GLB_DIR_PREFIX: "/tmp/storage/app/public/model/"
      CONVERT_TIMEOUT: 600
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis

volumes:
  pgdata:
  redis:
