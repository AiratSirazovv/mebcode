[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:blender-worker]
command=python3 -u /tmp/blender/worker.py
directory=/tmp

; жизненный цикл
autostart=true
autorestart=true
startsecs=5
startretries=999999

; graceful shutdown: даём воркеру доработать текущую Blender-конвертацию
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true

; логи прямиком в stdout/stderr контейнера → видны в `docker compose logs`
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
